<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014">
<meta name="description" content="Tempo: free music streaming plus your own files, on your phone and computer.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<link rel="preconnect" href="https://api.audius.co" crossorigin>
<link rel="preconnect" href="https://w.soundcloud.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tempo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <a class="brand" href="#/home"><img src="icon.svg" alt="" width="30" height="30"><span>Tempo</span></a>
    <nav class="side-nav">
      <a href="#/home" data-nav="home"><i data-icon="home"></i>Home</a>
      <a href="#/search" data-nav="search"><i data-icon="search"></i>Search</a>
      <a href="#/library" data-nav="library"><i data-icon="library"></i>Your Library</a>
    </nav>
    <div class="side-sec">
      <div class="side-head"><span>Playlists</span><button class="ib" data-act="newPlaylist" aria-label="New playlist"><i data-icon="plus"></i></button></div>
      <div id="sidePl" class="side-pl"></div>
    </div>
    <div class="side-foot">
      <button class="btn primary block" data-act="import"><i data-icon="upload"></i>Add music</button>
      <button class="btn ghost block" data-act="importDir"><i data-icon="folder"></i>Add a folder</button>
      <button class="btn ghost block" id="installBtn" data-act="install" hidden><i data-icon="download"></i>Install app</button>
      <a class="acct-btn" id="acctBtn" href="#/account" data-nav="account"></a>
    </div>
  </aside>

  <main id="main"><div id="view"></div></main>

  <footer id="player" class="is-empty">
    <div class="pl-left" data-act="openNP">
      <div class="art sm" id="pArt"></div>
      <div class="meta"><div class="ttl" id="pTitle">Nothing playing</div><div class="sub" id="pArtist">Pick a song to start</div></div>
      <button class="ib like" id="pLike" data-act="likeCur" aria-label="Like"><i data-icon="heart"></i></button>
    </div>
    <div class="pl-center">
      <div class="ctrls">
        <button class="ib tgl" data-act="shuffle" aria-label="Shuffle"><i data-icon="shuffle"></i></button>
        <button class="ib" data-act="prev" aria-label="Previous"><i data-icon="prev"></i></button>
        <button class="ib playbtn" data-act="toggle" aria-label="Play"><i data-icon="play"></i></button>
        <button class="ib" data-act="next" aria-label="Next"><i data-icon="next"></i></button>
        <button class="ib tgl" data-act="repeat" aria-label="Repeat"><i data-icon="repeat"></i></button>
      </div>
      <div class="seek-row"><span class="time" data-t="cur">0:00</span><input type="range" class="seek" min="0" max="1000" value="0" aria-label="Seek"><span class="time" data-t="dur">0:00</span></div>
    </div>
    <div class="pl-right">
      <button class="ib" data-act="queue" aria-label="Queue"><i data-icon="queue"></i></button>
      <button class="ib" data-act="mute" id="muteBtn" aria-label="Mute"><i data-icon="volume"></i></button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
    </div>
    <button class="ib m-play" data-act="toggle" aria-label="Play"><i data-icon="play"></i></button>
    <div class="m-prog"><i id="mProg"></i></div>
  </footer>

  <nav id="tabbar">
    <a href="#/home" data-nav="home"><i data-icon="home"></i><span>Home</span></a>
    <a href="#/search" data-nav="search"><i data-icon="search"></i><span>Search</span></a>
    <a href="#/library" data-nav="library"><i data-icon="library"></i><span>Library</span></a>
    <a href="#/account" data-nav="account"><i data-icon="user"></i><span>Account</span></a>
  </nav>
</div>

<section id="np" aria-label="Now playing" hidden>
  <div class="np-bg" id="npBg"></div>
  <div class="np-inner">
    <header class="np-top">
      <button class="ib" data-act="closeNP" aria-label="Close"><i data-icon="down"></i></button>
      <div class="np-from"><small>PLAYING FROM</small><a id="npFrom" data-act="closeNP" href="#/home">Library</a></div>
      <button class="ib" data-act="queue" aria-label="Queue"><i data-icon="queue"></i></button>
    </header>
    <div class="np-art-wrap"><div class="art xl" id="npArt"></div></div>
    <div class="np-info">
      <div class="meta"><div class="ttl" id="npTitle">Nothing playing</div><a class="sub" id="npArtist" data-act="closeNP" href="#/home"></a></div>
      <button class="ib like big" id="npLike" data-act="likeCur" aria-label="Like"><i data-icon="heart"></i></button>
    </div>
    <div class="np-seek">
      <input type="range" class="seek" min="0" max="1000" value="0" aria-label="Seek">
      <div class="times"><span class="time" data-t="cur">0:00</span><span class="time" data-t="dur">0:00</span></div>
    </div>
    <div class="np-ctrls">
      <button class="ib tgl" data-act="shuffle" aria-label="Shuffle"><i data-icon="shuffle"></i></button>
      <button class="ib big" data-act="prev" aria-label="Previous"><i data-icon="prev"></i></button>
      <button class="ib playbtn huge" data-act="toggle" aria-label="Play"><i data-icon="play"></i></button>
      <button class="ib big" data-act="next" aria-label="Next"><i data-icon="next"></i></button>
      <button class="ib tgl" data-act="repeat" aria-label="Repeat"><i data-icon="repeat"></i></button>
    </div>
    <a class="np-source" id="npSource" href="https://audius.co" target="_blank" rel="noopener" hidden>Listen on Audius ↗</a>
  </div>
</section>

<aside id="scBox" hidden aria-label="SoundCloud player">
  <div class="sc-head"><span>Playing from SoundCloud</span><button class="ib" data-act="scMin" aria-label="Shrink player"><i data-icon="down"></i></button></div>
  <div id="scFrame"></div>
</aside>
<div id="menu" role="menu" hidden></div>
<div id="scrim" hidden></div>
<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<div id="drop" hidden><div><i data-icon="upload"></i><p>Drop songs or folders to add them</p></div></div>
<input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.oga,.opus,.webm,.aif,.aiff" multiple hidden>
<input type="file" id="dirIn" webkitdirectory multiple hidden>
<audio id="audio" preload="auto"></audio>
<script type="module" src="app.js"></script>
</body>
</html>
