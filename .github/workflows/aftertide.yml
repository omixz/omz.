name: AFTERTIDE checks

on:
  push:
    paths: ["aftertide/**", ".github/workflows/aftertide.yml"]
  pull_request:
    paths: ["aftertide/**", ".github/workflows/aftertide.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static checks
        run: python3 aftertide/tools/check_luau.py
      - name: Place file is up to date with src/
        run: |
          python3 aftertide/tools/build_place.py
          git diff --exit-code -- aftertide/build/Aftertide.rbxlx || { echo "Run python3 aftertide/tools/build_place.py and commit the result"; exit 1; }
      - name: Revenue model runs
        run: python3 aftertide/tools/revenue_model.py
