<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Castle Clash</title>
<style>
  /* URL options: ?sound=0  ?demo=1 (fake viewers, for previewing)  ?bg=transparent (for OBS) */
  html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; touch-action: manipulation; }
  body.transparent { background: transparent; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script src="/shared/client.js"></script>
<script src="/shared/sounds.js"></script>
<script>
// =====================================================================
//  Castle Clash: an interactive TikTok LIVE game.
//  Viewers comment to pick a team. Likes send soldiers, gifts send
//  knights, giants, dragons and meteors. Destroy the enemy castle to win.
// =====================================================================
const W = 540, H = 960;                      // logical portrait resolution (9:16)
const TOP_FRONT = 205, BOT_FRONT = 765;      // y where each castle's wall begins
const MAX_UNITS = 220;                        // keeps phones smooth
const P = LT.params;
const SOUND = P.get('sound') !== '0';
if (P.get('bg') === 'transparent') document.body.classList.add('transparent');

let cfg = { teamA: 'RED', teamB: 'BLUE', joinA: '1, red', joinB: '2, blue', likesPerSoldier: 5, castleHp: 2000, knightCoins: 1, giantCoins: 10, dragonCoins: 99, meteorCoins: 500, followUnits: 2, shareUnits: 5, intermission: 10 };
const TEAM_COLORS = [{ main: '#ff3b5c', dark: '#9e1730', light: '#ff9aab' }, { main: '#2f8bff', dark: '#14448f', light: '#9cc8ff' }];

const UNIT = {
  soldier: { hp: 14, dmg: 6, speed: 46, r: 10, castle: 3, label: false },
  knight:  { hp: 55, dmg: 14, speed: 40, r: 14, castle: 9, label: false, badge: '⚔️' },
  giant:   { hp: 320, dmg: 34, speed: 24, r: 22, castle: 30, label: true, badge: '🛡️' },
  dragon:  { hp: 1e9, dmg: 45, speed: 75, r: 24, castle: 70, label: true, life: 11 },
};

// ------------------------------------------------------------- canvas --
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// ------------------------------------------------------------- state --
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('cc-' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cc-' + k, JSON.stringify(v)); } catch {} },
};
const teamOf = new Map(store.get('teams', []));   // userKey -> 0 | 1
const wins = store.get('wins', [0, 0]);
let units = [], particles = [], floats = [], feed = [], meteors = [];
let castles, roundOver = null, roundStart = performance.now(), shake = 0;
let damageBy = new Map();                         // userKey -> {name, avatar, team, dmg}
const likeBank = new Map(), streakSeen = new Map();
let lastActivity = 0;

function newRound() {
  castles = [0, 1].map((t) => ({ team: t, hp: cfg.castleHp, max: cfg.castleHp, flash: 0 }));
  units = []; meteors = []; damageBy = new Map(); roundOver = null; roundStart = performance.now();
  likeBank.clear();
}
newRound();

const userKey = (u) => u.id || u.uniqueId || u.nickname;
const teamName = (t) => (t === 0 ? cfg.teamA : cfg.teamB);
const words = (s) => String(s || '').toLowerCase().split(',').map((w) => w.trim()).filter(Boolean);

function membersCount() {
  const c = [0, 0];
  for (const t of teamOf.values()) c[t]++;
  return c;
}
let saveTeamsTimer;
function saveTeams() { clearTimeout(saveTeamsTimer); saveTeamsTimer = setTimeout(() => store.set('teams', [...teamOf].slice(-3000)), 1000); }

function teamFor(user, announce = true) {
  const k = userKey(user);
  if (teamOf.has(k)) return teamOf.get(k);
  const c = membersCount();
  const t = c[0] === c[1] ? (Math.random() < 0.5 ? 0 : 1) : c[0] < c[1] ? 0 : 1;
  teamOf.set(k, t); saveTeams();
  if (announce) pushFeed(`${user.nickname} joined ${teamName(t)}`, t);
  return t;
}

function pushFeed(text, team) {
  feed.push({ text, team, t: performance.now() });
  if (feed.length > 5) feed.shift();
}

// ------------------------------------------------------------ avatars --
const sprites = new Map();
function sprite(user, team, r) {
  const key = `${userKey(user)}|${team}|${r}`;
  if (sprites.has(key)) return sprites.get(key);
  if (sprites.size > 1500) sprites.clear();
  const s = Math.ceil(r * 2 + 6), c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d'), col = TEAM_COLORS[team];
  const ring = () => { g.lineWidth = 3; g.strokeStyle = col.main; g.beginPath(); g.arc(s / 2, s / 2, r + 1, 0, Math.PI * 2); g.stroke(); };
  g.fillStyle = col.dark; g.beginPath(); g.arc(s / 2, s / 2, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.font = `700 ${Math.round(r * 1.1)}px system-ui`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText((user.nickname || '?').trim().charAt(0).toUpperCase() || '?', s / 2, s / 2 + 1);
  ring();
  if (user.avatar) {
    const img = new Image();
    img.referrerPolicy = 'no-referrer';
    img.onload = () => { g.save(); g.beginPath(); g.arc(s / 2, s / 2, r, 0, Math.PI * 2); g.clip(); g.drawImage(img, s / 2 - r, s / 2 - r, r * 2, r * 2); g.restore(); ring(); };
    img.src = user.avatar;
  }
  sprites.set(key, c);
  return c;
}

// ------------------------------------------------------------- spawning --
function spawn(type, user, team) {
  const d = UNIT[type];
  if (units.length >= MAX_UNITS && type !== 'dragon') {
    // Battlefield is full: the unit charges straight into the enemy castle instead.
    hitCastle(1 - team, d.castle * 4, user, team);
    return;
  }
  const y = team === 0 ? BOT_FRONT + 8 + Math.random() * 20 : TOP_FRONT - 8 - Math.random() * 20;
  units.push({
    type, team, user, key: userKey(user), x: 40 + Math.random() * (W - 80), y,
    hp: d.hp, max: d.hp, r: d.r, born: performance.now(), lane: (Math.random() - 0.5) * 30, hit: 0,
  });
}

function spawnMany(type, n, user, team, cap) {
  const k = Math.min(n, cap);
  for (let i = 0; i < k; i++) setTimeout(() => !roundOver && spawn(type, user, team), i * 90);
  if (n > k) hitCastle(1 - team, UNIT[type].castle * 6 * (n - k), user, team);
}

function tierFor(coins) {
  if (coins >= cfg.meteorCoins) return 'meteor';
  if (coins >= cfg.dragonCoins) return 'dragon';
  if (coins >= cfg.giantCoins) return 'giant';
  if (coins >= cfg.knightCoins) return 'knight';
  return 'soldier';
}

function giftUnits(user, gift, count) {
  if (count <= 0) return;
  const team = teamFor(user);
  const tier = tierFor(gift.coinsEach || 1);
  const nice = { soldier: 'Soldier', knight: 'Knight', giant: 'Giant', dragon: 'DRAGON', meteor: 'METEOR' }[tier];
  pushFeed(`${user.nickname}: ${count}x ${gift.name} → ${count > 1 ? count + ' ' : ''}${nice}${count > 1 && tier !== 'meteor' ? 's' : ''}!`, team);
  if (tier === 'meteor') {
    for (let i = 0; i < Math.min(count, 3); i++) setTimeout(() => meteor(user, team), i * 900);
    if (count > 3) hitCastle(1 - team, (count - 3) * cfg.castleHp * 0.08, user, team);
    if (SOUND) Sounds.play('fanfare');
  } else if (tier === 'dragon') {
    spawnMany('dragon', count, user, team, 3);
    if (SOUND) Sounds.play('fanfare');
  } else {
    spawnMany(tier, count, user, team, tier === 'giant' ? 6 : 15);
    if (SOUND) Sounds.play(tier === 'giant' ? 'levelup' : 'coin');
  }
}

function meteor(user, team) {
  if (roundOver) return;
  const ty = team === 0 ? TOP_FRONT + 120 : BOT_FRONT - 120;
  meteors.push({ x: W / 2 + (Math.random() - 0.5) * 100, y: -60, ty, team, user, t: 0 });
}

function explodeMeteor(m) {
  shake = 18;
  if (SOUND) Sounds.play('drumroll');
  for (const u of units) if (u.team !== m.team && u.type !== 'dragon') { u.hp = 0; burst(u.x, u.y, TEAM_COLORS[u.team].main, 8); }
  hitCastle(1 - m.team, cfg.castleHp * 0.12, m.user, m.team);
  for (let i = 0; i < 70; i++) particles.push({ x: m.x, y: m.ty, vx: (Math.random() - 0.5) * 600, vy: (Math.random() - 0.5) * 600, life: 0.9, c: i % 2 ? '#ffd23f' : '#ff6b2b', s: 3 + Math.random() * 4 });
  floats.push({ x: m.x, y: m.ty, text: `☄️ ${m.user.nickname}!`, life: 1.8, c: '#ffd23f', size: 30 });
}

// -------------------------------------------------------------- combat --
function credit(user, team, dmg) {
  const k = userKey(user);
  let d = damageBy.get(k);
  if (!d) damageBy.set(k, (d = { name: user.nickname, user, team, dmg: 0 }));
  d.dmg += dmg;
}

function hitCastle(t, dmg, user, attackerTeam) {
  if (roundOver) return;
  const c = castles[t];
  c.hp = Math.max(0, c.hp - dmg); c.flash = 0.15;
  if (user) credit(user, attackerTeam, dmg * 3); // castle damage is worth more for MVP
  if (c.hp <= 0) endRound(1 - t);
}

function burst(x, y, c, n = 6) {
  if (particles.length > 350) return;
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220, life: 0.5, c, s: 2 + Math.random() * 3 });
}

function update(dt) {
  const now = performance.now();
  for (const u of units) {
    if (u.hp <= 0) continue;
    const d = UNIT[u.type];
    const dir = u.team === 0 ? -1 : 1;
    const enemyFront = u.team === 0 ? TOP_FRONT : BOT_FRONT;

    if (u.type === 'dragon') {
      // Flies over everything, scorching enemies underneath, then smashes the castle.
      const atCastle = u.team === 0 ? u.y - u.r <= enemyFront - 40 : u.y + u.r >= enemyFront + 40;
      if (!atCastle) u.y += dir * d.speed * dt;
      else { hitCastle(1 - u.team, d.castle * dt, u.user, u.team); if (Math.random() < 0.3) burst(u.x, u.y + dir * 30, '#ff8a00', 2); }
      for (const e of units) if (e.team !== u.team && e.hp > 0 && e.type !== 'dragon' && Math.abs(e.x - u.x) < 60 && Math.abs(e.y - u.y) < 60) { e.hp -= d.dmg * dt; credit(u.user, u.team, d.dmg * dt); }
      if ((now - u.born) / 1000 > d.life) u.hp = 0;
      continue;
    }

    // nearest enemy ground unit
    let best = null, bd = 85 * 85;
    for (const e of units) {
      if (e.team === u.team || e.hp <= 0 || e.type === 'dragon') continue;
      const dx = e.x - u.x, dy = e.y - u.y, dd = dx * dx + dy * dy;
      if (dd < bd) { bd = dd; best = e; }
    }
    if (best) {
      const dist = Math.sqrt(bd), reach = u.r + best.r + 2;
      if (dist <= reach) {
        best.hp -= d.dmg * dt; best.hit = 0.1; credit(u.user, u.team, d.dmg * dt);
        if (Math.random() < dt * 4) burst((u.x + best.x) / 2, (u.y + best.y) / 2, '#fff', 2);
      } else {
        u.x += ((best.x - u.x) / dist) * d.speed * dt;
        u.y += ((best.y - u.y) / dist) * d.speed * dt;
      }
    } else {
      const atWall = u.team === 0 ? u.y - u.r <= enemyFront : u.y + u.r >= enemyFront;
      if (atWall) {
        hitCastle(1 - u.team, d.castle * dt, u.user, u.team);
        if (Math.random() < dt * 3) burst(u.x, enemyFront, TEAM_COLORS[1 - u.team].light, 2);
      } else {
        u.y += dir * d.speed * dt;
        u.x += Math.sin((now - u.born) / 400 + u.lane) * 6 * dt; // little march wobble
        u.x = Math.max(u.r, Math.min(W - u.r, u.x));
      }
    }
    u.hit = Math.max(0, u.hit - dt);
  }
  // remove the dead
  const alive = [];
  for (const u of units) {
    if (u.hp > 0) alive.push(u);
    else if (u.type !== 'dragon') burst(u.x, u.y, TEAM_COLORS[u.team].main, u.type === 'giant' ? 16 : 5);
  }
  units = alive;

  for (const m of meteors) { m.t += dt; m.y += 900 * dt; if (m.y >= m.ty && !m.done) { m.done = true; explodeMeteor(m); } }
  meteors = meteors.filter((m) => !m.done);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
  particles = particles.filter((p) => p.life > 0);
  for (const f of floats) { f.y -= 30 * dt; f.life -= dt; }
  floats = floats.filter((f) => f.life > 0);
  for (const c of castles) c.flash = Math.max(0, c.flash - dt);
  shake = Math.max(0, shake - 40 * dt);

  if (roundOver && now > roundOver.until) newRound();
}

function endRound(winner) {
  if (roundOver) return;
  wins[winner]++; store.set('wins', wins);
  const mvps = [...damageBy.values()].sort((a, b) => b.dmg - a.dmg).slice(0, 3);
  roundOver = { winner, mvps, until: performance.now() + cfg.intermission * 1000 };
  shake = 25;
  if (SOUND) Sounds.play('fanfare');
}

// ------------------------------------------------------------- drawing --
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawField() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b2a4a'); g.addColorStop(0.5, '#2c4a2a'); g.addColorStop(1, '#4a1f2c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // grass stripes on the battlefield
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let y = TOP_FRONT; y < BOT_FRONT; y += 40) if ((y / 40) % 2 < 1) ctx.fillRect(0, y, W, 20);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.setLineDash([10, 10]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, (TOP_FRONT + BOT_FRONT) / 2); ctx.lineTo(W, (TOP_FRONT + BOT_FRONT) / 2); ctx.stroke(); ctx.setLineDash([]);
}

function drawCastle(t) {
  const c = castles[t], col = TEAM_COLORS[t];
  const top = t === 1, wallY = top ? TOP_FRONT : BOT_FRONT;
  const y0 = top ? 95 : BOT_FRONT, h = top ? TOP_FRONT - 95 : 110;
  ctx.save();
  if (c.flash > 0) ctx.globalAlpha = 0.6 + Math.random() * 0.4;
  // wall
  ctx.fillStyle = col.dark; ctx.fillRect(0, y0, W, h);
  ctx.fillStyle = col.main;
  const battY = top ? wallY - 14 : wallY;
  for (let x = 0; x < W; x += 36) ctx.fillRect(x + 4, battY, 26, 14);
  // towers
  for (const tx of [40, W / 2, W - 40]) {
    const th = tx === W / 2 ? 80 : 60, tw = tx === W / 2 ? 90 : 60;
    const ty = top ? y0 + 6 : y0 + h - th - 6;
    ctx.fillStyle = col.main; roundRect(tx - tw / 2, ty, tw, th, 8); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.35)'; roundRect(tx - 9, ty + th / 2 - 12, 18, 24, 9); ctx.fill();
  }
  // damage cracks
  const dmg = 1 - c.hp / c.max;
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3;
  for (let i = 0; i < Math.floor(dmg * 8); i++) {
    const x = (i * 97 + 30) % W, y = y0 + ((i * 53) % h);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 12, y + 14); ctx.lineTo(x + 4, y + 26); ctx.stroke();
  }
  ctx.restore();
  // HP bar
  const by = top ? TOP_FRONT - 44 : BOT_FRONT + 18, bw = W - 120;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(60, by, bw, 24, 12); ctx.fill();
  ctx.fillStyle = col.light; roundRect(62, by + 2, Math.max(0, (bw - 4) * (c.hp / c.max)), 20, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 14px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`${teamName(t)} CASTLE  ${Math.ceil(c.hp)} / ${c.max}`, W / 2, by + 12);
}

function drawUnits() {
  // draw from back to front so lower units overlap correctly
  const sorted = units.slice().sort((a, b) => a.y - b.y);
  for (const u of sorted) {
    const d = UNIT[u.type];
    if (u.type === 'dragon') {
      ctx.save(); ctx.translate(u.x, u.y);
      if (u.team === 1) ctx.scale(1, -1);
      ctx.font = '54px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🐉', 0, 0); ctx.restore();
      ctx.drawImage(sprite(u.user, u.team, 12), u.x - 15, u.y - 15 + (u.team === 0 ? 26 : -26));
    } else {
      const s = sprite(u.user, u.team, u.r);
      ctx.globalAlpha = u.hit > 0 ? 0.6 : 1;
      ctx.drawImage(s, u.x - s.width / 2, u.y - s.height / 2);
      ctx.globalAlpha = 1;
      if (d.badge) { ctx.font = `${Math.round(u.r * 0.9)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(d.badge, u.x + u.r * 0.8, u.y - u.r * 0.8); }
      if (u.hp < u.max) {
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(u.x - u.r, u.y + u.r + 3, u.r * 2, 4);
        ctx.fillStyle = TEAM_COLORS[u.team].light; ctx.fillRect(u.x - u.r, u.y + u.r + 3, u.r * 2 * Math.max(0, u.hp / u.max), 4);
      }
    }
    if (d.label) {
      ctx.font = '700 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.8)';
      const ly = u.type === 'dragon' ? u.y + (u.team === 0 ? 44 : -60) : u.y + u.r + 8;
      ctx.strokeText(u.user.nickname.slice(0, 14), u.x, ly); ctx.fillStyle = '#fff'; ctx.fillText(u.user.nickname.slice(0, 14), u.x, ly);
    }
  }
}

function drawFx() {
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); }
  ctx.globalAlpha = 1;
  for (const m of meteors) {
    ctx.font = '70px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.PI * 0.75); ctx.fillText('☄️', 0, 0); ctx.restore();
  }
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life); ctx.font = `900 ${f.size}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.c; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHud() {
  // top bar: score
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, W, 92);
  const m = membersCount(), counts = [0, 0];
  for (const u of units) counts[u.team]++;
  ctx.textBaseline = 'middle';
  ctx.font = '900 30px system-ui';
  ctx.fillStyle = TEAM_COLORS[0].main; ctx.textAlign = 'left'; ctx.fillText(cfg.teamA, 18, 30);
  ctx.fillStyle = TEAM_COLORS[1].main; ctx.textAlign = 'right'; ctx.fillText(cfg.teamB, W - 18, 30);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '900 34px system-ui';
  ctx.fillText(`${wins[0]} : ${wins[1]}`, W / 2, 30);
  ctx.font = '600 13px system-ui'; ctx.fillStyle = '#c9d1e0';
  ctx.textAlign = 'left'; ctx.fillText(`👥 ${m[0]}   ⚔️ ${counts[0]}`, 18, 64);
  ctx.textAlign = 'right'; ctx.fillText(`⚔️ ${counts[1]}   👥 ${m[1]}`, W - 18, 64);
  ctx.textAlign = 'center'; ctx.fillText('CASTLE CLASH', W / 2, 64);

  // event feed (left side of the battlefield)
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.font = '700 15px system-ui';
  const now = performance.now();
  feed.forEach((f, i) => {
    const age = (now - f.t) / 1000; if (age > 12) return;
    ctx.globalAlpha = Math.min(1, 12 - age);
    const y = TOP_FRONT + 14 + i * 26, w = Math.min(W - 24, ctx.measureText(f.text).width + 20);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(12, y, w, 22, 11); ctx.fill();
    ctx.fillStyle = f.team === undefined ? '#fff' : TEAM_COLORS[f.team].light; ctx.fillText(f.text, 22, y + 3);
  });
  ctx.globalAlpha = 1;

  // how-to-play legend (bottom)
  ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, H - 82, W, 82);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  const a = words(cfg.joinA)[0] || '1', b = words(cfg.joinB)[0] || '2';
  ctx.font = '800 17px system-ui';
  ctx.fillText(`💬 Type "${a}" for ${cfg.teamA} or "${b}" for ${cfg.teamB}   ❤️ Tap likes = soldiers`, W / 2, H - 60);
  ctx.font = '700 15px system-ui'; ctx.fillStyle = '#ffd84d';
  ctx.fillText(`🌹 ${cfg.knightCoins}🪙 Knight · ${cfg.giantCoins}🪙 Giant · ${cfg.dragonCoins}🪙 Dragon · ${cfg.meteorCoins}🪙 Meteor`, W / 2, H - 32);
  ctx.font = '600 12px system-ui'; ctx.fillStyle = '#9aa3b5';
  ctx.fillText(`Follow = ${cfg.followUnits} knights · Share = ${cfg.shareUnits} soldiers · ${cfg.likesPerSoldier} likes = 1 soldier`, W / 2, H - 11);

  // idle hint
  if (!roundOver && units.length === 0 && now - lastActivity > 4000) {
    const pulse = 1 + Math.sin(now / 300) * 0.06;
    ctx.save(); ctx.translate(W / 2, (TOP_FRONT + BOT_FRONT) / 2); ctx.scale(pulse, pulse);
    ctx.font = '900 30px system-ui'; ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
    ctx.strokeText('❤️ TAP LIKE TO ATTACK! ❤️', 0, -20); ctx.fillText('❤️ TAP LIKE TO ATTACK! ❤️', 0, -20);
    ctx.font = '700 18px system-ui'; ctx.strokeText('Pick a team in chat 👇', 0, 22); ctx.fillText('Pick a team in chat 👇', 0, 22);
    ctx.restore();
  }
}

function drawRoundOver() {
  if (!roundOver) return;
  const col = TEAM_COLORS[roundOver.winner];
  ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 58px system-ui'; ctx.lineWidth = 8; ctx.strokeStyle = '#000';
  const title = `${teamName(roundOver.winner)} WINS!`;
  ctx.strokeText(title, W / 2, 300); ctx.fillStyle = col.main; ctx.fillText(title, W / 2, 300);
  ctx.font = '800 22px system-ui'; ctx.fillStyle = '#fff'; ctx.fillText('🏆 Top fighters this round', W / 2, 390);
  const medals = ['🥇', '🥈', '🥉'];
  roundOver.mvps.forEach((m, i) => {
    const y = 450 + i * 64;
    ctx.fillStyle = 'rgba(255,255,255,.08)'; roundRect(70, y - 26, W - 140, 52, 26); ctx.fill();
    ctx.font = '30px system-ui'; ctx.textAlign = 'left'; ctx.fillText(medals[i], 86, y);
    ctx.drawImage(sprite(m.user, m.team, 18), 132, y - 21);
    ctx.font = '800 20px system-ui'; ctx.fillStyle = TEAM_COLORS[m.team].light; ctx.fillText(m.name.slice(0, 16), 180, y);
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffd84d'; ctx.fillText(`${Math.round(m.dmg)} dmg`, W - 86, y);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  });
  const left = Math.max(0, Math.ceil((roundOver.until - performance.now()) / 1000));
  ctx.font = '700 20px system-ui'; ctx.fillStyle = '#c9d1e0'; ctx.fillText(`Next battle in ${left}…`, W / 2, 680);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; lastFrame = now;
  update(dt);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (!document.body.classList.contains('transparent')) drawField(); else ctx.clearRect(-50, -50, W + 100, H + 100);
  drawCastle(1); drawCastle(0); drawUnits(); drawFx();
  ctx.restore();
  drawHud(); drawRoundOver();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ------------------------------------------------------- live events --
function onEvent(ev) {
  if (!ev || !ev.user) return;
  lastActivity = performance.now();
  if (roundOver && ev.type !== 'chat') return; // between rounds only team picks count
  const u = ev.user;
  switch (ev.type) {
    case 'chat': {
      const c = ev.comment.trim().toLowerCase();
      const pick = words(cfg.joinA).includes(c) ? 0 : words(cfg.joinB).includes(c) ? 1 : -1;
      if (pick >= 0) {
        const k = userKey(u), was = teamOf.get(k);
        teamOf.set(k, pick); saveTeams();
        if (was !== pick) pushFeed(`${u.nickname} joined ${teamName(pick)}`, pick);
      }
      break;
    }
    case 'like': {
      const team = teamFor(u);
      const k = userKey(u);
      const bank = (likeBank.get(k) || 0) + (ev.likes || 1);
      const n = Math.floor(bank / cfg.likesPerSoldier);
      likeBank.set(k, bank - n * cfg.likesPerSoldier);
      if (n > 0) spawnMany('soldier', n, u, team, 10);
      break;
    }
    case 'giftStreak': {
      // combo in progress: send units right away instead of waiting for the combo to end
      const k = `${userKey(u)}|${ev.gift.id || ev.gift.name}`;
      const seen = streakSeen.get(k) || 0;
      if (ev.gift.count > seen) { giftUnits(u, ev.gift, ev.gift.count - seen); streakSeen.set(k, ev.gift.count); }
      break;
    }
    case 'gift': {
      const k = `${userKey(u)}|${ev.gift.id || ev.gift.name}`;
      const seen = streakSeen.get(k) || 0; streakSeen.delete(k);
      giftUnits(u, ev.gift, ev.gift.count - seen);
      break;
    }
    case 'follow': {
      const team = teamFor(u);
      pushFeed(`${u.nickname} followed → ${cfg.followUnits} knights!`, team);
      spawnMany('knight', cfg.followUnits, u, team, 10);
      break;
    }
    case 'share': {
      const team = teamFor(u);
      pushFeed(`${u.nickname} shared → ${cfg.shareUnits} soldiers!`, team);
      spawnMany('soldier', cfg.shareUnits, u, team, 20);
      break;
    }
  }
}

const socket = io();
socket.on('connect', () => socket.emit('getState', (s) => { if (s.settings?.game) applyCfg(s.settings.game); }));
socket.on('game', applyCfg);
socket.on('event', onEvent);
socket.on('control', (c) => {
  if (c.cmd === 'gameReset') { wins[0] = wins[1] = 0; store.set('wins', wins); newRound(); pushFeed('New game started!'); }
});
function applyCfg(g) {
  const hpChanged = g.castleHp !== cfg.castleHp;
  cfg = { ...cfg, ...g };
  if (hpChanged && g.castleHp) for (const c of castles) { const wasFull = c.hp >= c.max; c.max = g.castleHp; c.hp = wasFull ? c.max : Math.min(c.hp, c.max); }
}

// ------------------------------------------------- hands-free running --
// No start button: the game runs by itself. Keep a phone's screen awake when
// allowed, and the first tap (if any) unlocks sound on phones and goes full screen.
async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
keepAwake();
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && keepAwake());
addEventListener('pointerdown', () => { Sounds.unlock(); keepAwake(); document.documentElement.requestFullscreen?.().catch(() => {}); }, { once: true });
// If the server restarts, the game reconnects by itself (socket.io); if the
// page somehow freezes, reload it so a 24/7 stream never gets stuck.
let lastFrame = performance.now();
setInterval(() => { if (performance.now() - lastFrame > 20000 && document.visibilityState === 'visible') location.reload(); }, 10000);

// ------------------------------------------------------------ demo mode --
if (P.get('demo') === '1') {
  const names = ['Mia', 'Leo', 'Zara', 'Omar', 'Kai', 'Noor', 'Ivy', 'Sam', 'Ava', 'Eli', 'Rin', 'Jo'];
  const gifts = [['Rose', 1], ['Finger Heart', 5], ['Doughnut', 30], ['Hand Hearts', 100], ['Galaxy', 1000]];
  const fake = () => { const n = names[Math.floor(Math.random() * names.length)]; return { id: 'demo-' + n, nickname: n, avatar: '' }; };
  setInterval(() => onEvent({ type: 'like', user: fake(), likes: 3 + Math.floor(Math.random() * 10) }), 250);
  setInterval(() => {
    const r = Math.random(), [name, coins] = r < 0.6 ? gifts[0] : r < 0.8 ? gifts[1] : r < 0.93 ? gifts[2] : r < 0.985 ? gifts[3] : gifts[4];
    onEvent({ type: 'gift', user: fake(), gift: { id: name, name, coinsEach: coins, count: 1 + Math.floor(Math.random() * 3) } });
  }, 2500);
}
